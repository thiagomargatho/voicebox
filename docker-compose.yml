# Voicebox — CUDA build, pinned à RTX 3060 (4000 Ada é reservada ao Ollama, produção)
# For AMD ROCm GPU acceleration use the overlay:
#   docker compose -f docker-compose.yml -f docker-compose.rocm.yml up --build

services:
  voicebox:
    build: .
    container_name: voicebox
    restart: unless-stopped

    # Docker cria /home/voicebox/.cache (pai do volume HF) como root a cada
    # recreate; o app roda como uid 999 e perde escrita fora do huggingface.
    # Chown não-recursivo antes do entrypoint original (roda como root, gosu depois).
    entrypoint: ["sh", "-c", "chown voicebox:voicebox /home/voicebox/.cache /home/voicebox/.cache/huggingface; exec /usr/local/bin/entrypoint.sh \"$@\"", "--"]
    # Sobrescrever entrypoint no compose descarta o CMD da imagem — redeclarar:
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "17493"]

    ports:
      # Host-side moved to 17600 so the dev/installed Voicebox can keep 17493.
      # Container still listens on its native port internally.
      # Bound to all interfaces so it's reachable via WireGuard/Tailscale/LAN IP.
      - "17600:17493"

    volumes:
      # Bind-mount for generated audio (customize the host path as needed)
      # Host side:      ./output/
      # Container side: /app/data/generations/
      - ./output:/app/data/generations

      # Named volume for profiles, DB, cache (persists across container restarts)
      - voicebox-data:/app/data

      # HuggingFace model cache (so models aren't re-downloaded on rebuild)
      - huggingface-cache:/home/voicebox/.cache/huggingface

    environment:
      - LOG_LEVEL=info
      - NUMBA_CACHE_DIR=/tmp/numba_cache

    networks:
      - voicebox-net

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 12G
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["GPU-9485602e-82eb-19dd-dff1-0cfc070788d9"]
              capabilities: [gpu]

networks:
  voicebox-net:
    driver: bridge

volumes:
  voicebox-data:
  huggingface-cache:
